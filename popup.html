<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Utilities</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="popup-header">
      <div class="header-brand">
        <svg class="yt-logo" viewBox="0 0 24 24" width="22" height="22" fill="#ff0000">
          <path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/>
        </svg>
        <span class="header-title">YouTube Utilities</span>
      </div>
      <span class="version-badge">v1.1</span>
    </header>

    <main class="popup-body">
      <div class="card">
        <div class="card-header">
          <h2 class="card-title">Channel Extraction</h2>
          <span class="badge loading" id="tab-count-badge">Loading tabs...</span>
        </div>
        <p class="card-description">
          Scan open YouTube video tabs in the current window and open their channel <code>/videos</code> pages in new tabs.
        </p>

        <button id="btn-open-channels" class="btn btn-primary" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
            <path d="M19 19H5V5h7V3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/>
          </svg>
          <span id="btn-text">Open Channels</span>
        </button>
      </div>

      <div id="status-container" class="status-container hidden">
        <div class="status-icon" id="status-icon">ℹ️</div>
        <div class="status-message" id="status-message">Scanning tabs...</div>
      </div>
    </main>

    <footer class="popup-footer">
      <span>Current Window Only</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
